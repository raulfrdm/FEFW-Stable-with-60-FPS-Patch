# Compila Fortune's Eden (FEFW v1.4.2) para Linux como AppImage portable.
# Basado en la receta de AppImage que trae el propio source.zip (docs/build/Linux-NS2.md).

name: Linux AppImage

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
      options: --privileged --device /dev/fuse
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          for _ in 1 2 3; do
            if pacman -Syu --noconfirm --needed --overwrite '*' \
                base-devel boost boost-libs catch2 cmake curl enet ffnvcodec-headers fmt \
                gamemode git glslang jq libva libvdpau libvpx libxcursor libxss nasm ninja \
                nlohmann-json patchelf pulseaudio pulseaudio-alsa python-requests qt6-base \
                qt6-charts qt6-tools qt6-wayland spirv-headers spirv-tools unzip \
                vulkan-headers vulkan-mesa-layers vulkan-utility-libraries wget xcb-util-cursor \
                xcb-util-image xcb-util-renderutil xcb-util-wm zip; then break; fi
          done
          wget -q --retry-connrefused --tries=30 \
            https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/refs/heads/main/useful-tools/get-debloated-pkgs.sh
          chmod +x get-debloated-pkgs.sh
          ./get-debloated-pkgs.sh --add-mesa qt6-base-mini libxml2-mini opus-nano

      - name: Descomprimir el codigo fuente
        run: |
          git config --global --add safe.directory '*'
          unzip -q source.zip -d fuente
          echo "SRC=$PWD/fuente/$(ls fuente)" >> "$GITHUB_ENV"

      - name: Configurar
        run: |
          cd "$SRC"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_QT=ON -DYUZU_USE_BUNDLED_QT=OFF -DENABLE_QT_TRANSLATION=OFF \
            -DENABLE_UPDATE_CHECKER=OFF -DENABLE_WEB_SERVICE=OFF -DENABLE_LTO=OFF \
            -DYUZU_USE_BUNDLED_FFMPEG=ON -DYUZU_USE_BUNDLED_SIRIT=ON \
            -DYUZU_USE_BUNDLED_OPENSSL=ON -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_DISABLE_LLVM=ON -DYUZU_CMD=OFF -DYUZU_ROOM_STANDALONE=OFF \
            -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF -DDYNARMIC_TESTS=OFF -DENABLE_WERROR=OFF

      - name: Compilar
        run: |
          cd "$SRC"
          cmake --build build --target yuzu

      - name: Crear AppImage
        run: |
          cd "$SRC"
          stage="$(mktemp -d)"
          curl -fL --retry 3 -o "$stage/quick-sharun" \
            https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/bacfcc005398d74e6454cdb8f494efe42e0bb60a/useful-tools/quick-sharun.sh
          echo "fa9dbe2532d568e1c1b8eeaba94d1c57109b776b5541d21b74d3f44b74faf4d3  $stage/quick-sharun" | sha256sum -c -
          chmod +x "$stage/quick-sharun"
          export APPDIR="$stage/AppDir" OUTPATH="$PWD/artifacts" OUTNAME="Fortunes-Eden.AppImage"
          export ICON="$PWD/dist/dev.eden_emu.eden.svg" DESKTOP="$PWD/dist/dev.eden_emu.eden.desktop"
          export OPTIMIZE_LAUNCH=0 STRACE_MODE=0 DEPLOY_OPENGL=1 DEPLOY_VULKAN=1
          export DEPLOY_DATADIR=0 DEPLOY_LOCALE=0 DEPLOY_KF=0 DEPLOY_QML=0 DEPLOY_QT_WEB_ENGINE=0
          export ADD_HOOKS=wayland-is-broken.hook
          "$stage/quick-sharun" build/bin/eden
          mkdir -p "$APPDIR/share/licenses/eden"
          cp -R LICENSE.txt LICENSES "$APPDIR/share/licenses/eden/"
          "$stage/quick-sharun" --make-appimage

      - name: Preparar carpeta portable (ajustes + parche 60 FPS)
        run: |
          out="$PWD/Fortunes-Eden-Linux"
          mkdir -p "$out/user/config"
          cp "$SRC/artifacts/Fortunes-Eden.AppImage" "$out/"
          cp portable-config/qt-config.ini "$out/user/config/"
          unzip -q download/FEFW-Stable-60FPS-Portable.zip 'user/load/*' -d "$out"
          cp LICENSE "$out/"
          printf '#!/bin/sh\ncd "$(dirname "$0")" && exec ./Fortunes-Eden.AppImage "$@"\n' > "$out/jugar.sh"
          chmod +x "$out/jugar.sh" "$out/Fortunes-Eden.AppImage"
          tar -czf Fortunes-Eden-Linux.tar.gz Fortunes-Eden-Linux

      - uses: actions/upload-artifact@v4
        with:
          name: Fortunes-Eden-Linux
          path: Fortunes-Eden-Linux.tar.gz
          retention-days: 30
